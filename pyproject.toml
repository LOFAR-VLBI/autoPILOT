[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoPILOT"
version = "0.0.0"
description = ""
requires-python = ">=3.11"

[project.scripts]
monitor_lbcals = "autoPILOT:monitor_lbcals.py"
monitor_lbfields = "autoPILOT:monitor_lbfields.py"
monitor_lotsshr = "autoPILOT:monitor_lotsshr.py"
monitor_ilotss = "autoPILOT.ilotss.OLD:main"

[tool.setuptools.packages.find]
include = ["autoPILOT", "autoPILOT.*"]

[tool.setuptools.package-data]
"autoPILOT.ilotss.calibrator_utils" = ["calibrator_medians_cache.h5"]
